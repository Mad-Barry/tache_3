name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Rickroll
        if: failure()
        run: |
          echo "Never gonna give you up, never gonna let you down"
          echo "![rick](https://img.youtube.com/vi/dQw4w9WgXcQ/0.jpg)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Never Gonna Give You Up](https://youtu.be/dQw4w9WgXcQ)" >> "$GITHUB_STEP_SUMMARY"

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trouver le commit de base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - name: Lancer Semgrep
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan --config p/java --config p/security-audit \
            --config p/owasp-top-ten --config p/cwe-top-25 --config p/secrets --error \
            --baseline-commit "${{ steps.base.outputs.sha }}" \
            --json-output=semgrep_rapport/semgrep-nouveaux.json .
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-nouveaux
          path: semgrep_rapport/semgrep-nouveaux.json

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Rickroll
        if: failure()
        run: |
          echo "Never gonna give you up, never gonna let you down"
          echo "![rick](https://img.youtube.com/vi/dQw4w9WgXcQ/0.jpg)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Never Gonna Give You Up](https://youtu.be/dQw4w9WgXcQ)" >> "$GITHUB_STEP_SUMMARY"
